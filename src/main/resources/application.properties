# ============================================
# Server Configuration
# ============================================
spring.application.name=ecommerce-api
server.port=8080

# ============================================
# MySQL Database (XAMPP)
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / Hibernate
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================
# JWT Configuration
# ============================================
jwt.secret=mySecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLongForHS256Algorithm
jwt.expiration=86400000

# ============================================
# Logging
# ============================================
logging.level.com.oceanfirst=DEBUG
logging.level.org.springframework.security=INFO

# ============================================
# Error Handling
# ============================================
server.error.include-message=always
server.error.include-binding-errors=always